name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "scala/github-actions-cli/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "scala/github-actions-cli/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["11", "17", "21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "sbt"

      - name: Compile
        run: sbt compile
        working-directory: scala/github-actions-cli

      - name: Run tests
        run: sbt test
        working-directory: scala/github-actions-cli

      - name: Check formatting
        run: sbt scalafmtCheck
        working-directory: scala/github-actions-cli
        if: matrix.java == '21' && matrix.os == 'ubuntu-latest'

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "sbt"

      - name: Build fat JAR
        run: sbt "cli/assembly"
        working-directory: scala/github-actions-cli

      - name: Verify JAR exists
        run: |
          ls -lh cli/target/scala-3.5.0/github-actions-cli.jar
          echo "JAR size: $(du -h cli/target/scala-3.5.0/github-actions-cli.jar | cut -f1)"
        working-directory: scala/github-actions-cli

      - name: Test JAR execution
        run: |
          java -jar cli/target/scala-3.5.0/github-actions-cli.jar version
        working-directory: scala/github-actions-cli

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-cli-jar
          path: scala/github-actions-cli/cli/target/scala-3.5.0/github-actions-cli.jar
          retention-days: 30

  native-image:
    name: Build native image on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    # Skip native image build for now - requires GraalVM native-image configuration
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"
          cache: "sbt"

      - name: Build native image
        run: sbt "cli/nativeImage"
        working-directory: scala/github-actions-cli
        continue-on-error: true

      - name: Test native image
        run: |
          if [ -f ./cli/target/native-image/gh-actions ]; then
            ./cli/target/native-image/gh-actions version
          else
            echo "Native image not built - skipping test"
          fi
        working-directory: scala/github-actions-cli

      - name: Upload native image
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gh-actions-${{ matrix.os }}
          path: scala/github-actions-cli/cli/target/native-image/gh-actions
          retention-days: 30
