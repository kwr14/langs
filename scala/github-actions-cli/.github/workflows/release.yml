name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-jar:
    name: Build fat JAR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'
    
    - name: Run tests
      run: sbt test
      working-directory: scala/github-actions-cli
    
    - name: Build fat JAR
      run: sbt "cli/assembly"
      working-directory: scala/github-actions-cli
    
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: github-actions-cli-jar
        path: scala/github-actions-cli/cli/target/scala-3.5.0/github-actions-cli.jar
  
  build-native:
    name: Build native image - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: gh-actions-linux-x86_64
          - os: macos-latest
            artifact-name: gh-actions-macos-x86_64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        native-image-job-reports: 'true'
        cache: 'sbt'
    
    - name: Build native image
      run: sbt "cli/nativeImage"
      working-directory: scala/github-actions-cli
    
    - name: Test native image
      run: |
        ./cli/target/native-image/gh-actions version
      working-directory: scala/github-actions-cli
    
    - name: Rename binary
      run: |
        mv cli/target/native-image/gh-actions cli/target/native-image/${{ matrix.artifact-name }}
      working-directory: scala/github-actions-cli
    
    - name: Upload native image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: scala/github-actions-cli/cli/target/native-image/${{ matrix.artifact-name }}
  
  release:
    name: Create Release
    needs: [build-jar, build-native]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create checksums
      run: |
        cd artifacts
        for dir in */; do
          cd "$dir"
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
          cd ..
        done
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/github-actions-cli-jar/github-actions-cli.jar
          artifacts/github-actions-cli-jar/github-actions-cli.jar.sha256
          artifacts/gh-actions-linux-x86_64/gh-actions-linux-x86_64
          artifacts/gh-actions-linux-x86_64/gh-actions-linux-x86_64.sha256
          artifacts/gh-actions-macos-x86_64/gh-actions-macos-x86_64
          artifacts/gh-actions-macos-x86_64/gh-actions-macos-x86_64.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

